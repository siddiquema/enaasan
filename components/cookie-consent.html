<div id="cookie-consent-root">
<div id="cookie-consent-banner" class="cookie-consent-banner" style="display: none;" role="region" aria-label="Privacy and analytics">
  <div class="cookie-consent-content">
    <div class="cookie-consent-text">
      <h3>Privacy &amp; Analytics</h3>
      <p>We use Google Analytics to understand how students use enaasan. This helps us improve the site. Your data is anonymous and never shared.</p>
      <p><a href="/privacy.html" target="_blank">Learn more about our privacy practices</a></p>
    </div>
    <div class="cookie-consent-actions">
      <button id="cookie-decline" class="cookie-btn cookie-decline" type="button">Minimal Tracking</button>
      <button id="cookie-accept" class="cookie-btn cookie-accept" type="button">Allow Analytics</button>
    </div>
  </div>
</div>

<style>
.cookie-consent-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--ink, #14273A);
  color: var(--chalk, #F2EFE9);
  border-top: 1px solid var(--border, #1E3A52);
  box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.25);
  z-index: 9999;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  line-height: 1.5;
}

.cookie-consent-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1.25rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 2rem;
}

.cookie-consent-text h3 {
  margin: 0 0 0.35rem 0;
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--chalk, #F2EFE9);
}

.cookie-consent-text p {
  margin: 0.35rem 0;
  color: var(--mist, #A8C0D4);
}

.cookie-consent-text a {
  color: var(--gold, #F0A500);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.cookie-consent-text a:hover {
  color: var(--glow, #FFD166);
}

.cookie-consent-actions {
  display: flex;
  gap: 0.75rem;
  flex-shrink: 0;
}

.cookie-btn {
  padding: 0.625rem 1.25rem;
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  white-space: nowrap;
}

.cookie-decline {
  background: transparent;
  color: var(--mist, #A8C0D4);
  border: 1px solid var(--border, #1E3A52);
}

.cookie-decline:hover {
  color: var(--chalk, #F2EFE9);
  border-color: var(--mist, #A8C0D4);
}

.cookie-accept {
  background: var(--gold, #F0A500);
  color: #0D1B2A;
  border: 1px solid var(--gold, #F0A500);
}

.cookie-accept:hover {
  background: var(--glow, #FFD166);
  border-color: var(--glow, #FFD166);
}

@media (max-width: 768px) {
  .cookie-consent-content {
    flex-direction: column;
    align-items: stretch;
    gap: 1rem;
    padding: 1rem 1.1rem;
  }

  .cookie-consent-actions {
    width: 100%;
    flex-direction: column;
  }

  .cookie-btn {
    width: 100%;
  }
}
</style>
</div>

<script>
  function initCookieConsent() {
    const banner = document.getElementById('cookie-consent-banner');
    const acceptBtn = document.getElementById('cookie-accept');
    const declineBtn = document.getElementById('cookie-decline');

    const consentKey = 'enaasan_analytics_consent';
    const consentGiven = localStorage.getItem(consentKey);

    // Only show banner if no consent decision has been made
    if (!consentGiven) {
      banner.style.display = 'block';
    }

    acceptBtn.addEventListener('click', function() {
      localStorage.setItem(consentKey, 'accepted');
      banner.style.display = 'none';
      loadAnalytics();
    });

    declineBtn.addEventListener('click', function() {
      localStorage.setItem(consentKey, 'declined');
      banner.style.display = 'none';
    });
  }

  function loadAnalytics() {
    const consentKey = 'enaasan_analytics_consent';
    const consentGiven = localStorage.getItem(consentKey);

    // Only load GA4 if user has accepted
    if (consentGiven === 'accepted') {
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-D4QMDFL8XF');

      const script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-D4QMDFL8XF';
      document.head.appendChild(script);
    }
  }

  // Initialize on page load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCookieConsent);
  } else {
    initCookieConsent();
  }

  // Load analytics if already consented
  loadAnalytics();
</script>
