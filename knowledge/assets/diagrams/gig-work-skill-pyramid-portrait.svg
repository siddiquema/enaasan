<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="t d">
  <!-- canonical: ENA-KCARD-CAREER-gig-work-skill-pyramid (portrait / mobile variant) -->
  <title id="t">Gig work is a pyramid, not just delivery</title>
  <desc id="d">Five levels of gig and field work sorted by skill, from entry-level delivery and driving at the base, through trained trades, digital and language skills, and professional work, to expert consulting at the top. Moving up, you are paid for judgment instead of time, you set the price instead of the app, and reputation instead of hours protects your income.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&amp;family=DM+Mono:wght@500&amp;display=swap');
      .eyebrow { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 22px; letter-spacing: 3px; fill: #C8860E; }
      .title   { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 46px; fill: #0D1B2A; }
      .sub     { font-family: 'DM Sans', sans-serif; font-size: 28px; fill: #4A6580; }
      .lvl     { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 17px; letter-spacing: 2.5px; }
      .name    { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 31px; }
      .paid    { font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 21px; }
      .num     { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 30px; fill: #0D1B2A; }
      .rname   { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 18px; letter-spacing: 2.5px; fill: #C8860E; }
      .ex      { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 26px; fill: #0D1B2A; }
      .get     { font-family: 'DM Sans', sans-serif; font-style: italic; font-size: 22px; fill: #4A6580; }
      .axis    { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 17px; letter-spacing: 2.5px; fill: #C8860E; }
      .shiftH  { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 17px; letter-spacing: 2.5px; fill: #A8C0D4; }
      .shift   { font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 27px; fill: #F2EFE9; }
      .shiftG  { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 27px; fill: #FFD166; }
      .foot    { font-family: 'DM Sans', sans-serif; font-size: 19px; fill: #4A6580; }
      .footB   { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 24px; fill: #0D1B2A; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#F0A500"/></marker>
  </defs>
  <rect width="1080" height="1920" fill="#FBF8F3"/>
  <rect width="1080" height="12" fill="#F0A500"/>
  <text x="60" y="92" class="eyebrow">AN ENAASAN FRAMEWORK · GIG &amp; FIELD WORK</text>
  <text x="60" y="170" class="title">The Gig Work Skill Pyramid</text>
  <text x="60" y="240" class="title">— not just delivery</text>
  <text x="60" y="298" class="sub">Five levels, broadly sorted by skill and value.</text>
  <text x="60" y="338" class="sub">Each step up needs skills you can demonstrate.</text>
  <line x1="44" y1="902" x2="44" y2="384" stroke="#F0A500" stroke-width="4" marker-end="url(#arrow)"/>
  <text transform="translate(30 902) rotate(-90)" class="axis">MORE SPECIALISED SKILL</text>
  <polygon points="400,370 680,370 742,470 338,470" fill="#0D1B2A"/>
  <text x="540" y="398" text-anchor="middle" class="lvl" fill="#F0A500">LEVEL 5</text>
  <text x="540" y="432" text-anchor="middle" class="name" fill="#FFD166">Expert</text>
  <text x="540" y="459" text-anchor="middle" class="paid" fill="#F2EFE9">Paid for specialised expertise</text>
  <polygon points="333,478 747,478 809,578 271,578" fill="#1E3A52"/>
  <text x="540" y="506" text-anchor="middle" class="lvl" fill="#FFD166">LEVEL 4</text>
  <text x="540" y="540" text-anchor="middle" class="name" fill="#F2EFE9">Professional</text>
  <text x="540" y="567" text-anchor="middle" class="paid" fill="#F2EFE9">Paid for specialised work &amp; outcomes</text>
  <polygon points="266,586 814,586 876,686 204,686" fill="#4A6580"/>
  <text x="540" y="614" text-anchor="middle" class="lvl" fill="#FFD166">LEVEL 3</text>
  <text x="540" y="648" text-anchor="middle" class="name" fill="#FFFFFF">Digital & Language Skills</text>
  <text x="540" y="675" text-anchor="middle" class="paid" fill="#FFFFFF">Paid for skilled output</text>
  <polygon points="199,694 881,694 943,794 137,794" fill="#8FA9C2"/>
  <text x="540" y="722" text-anchor="middle" class="lvl" fill="#0D1B2A">LEVEL 2</text>
  <text x="540" y="756" text-anchor="middle" class="name" fill="#0D1B2A">Trained Trades</text>
  <text x="540" y="783" text-anchor="middle" class="paid" fill="#0D1B2A">Paid for a certified or proven skill</text>
  <polygon points="132,802 948,802 1010,902 70,902" fill="#D3E0EB"/>
  <text x="540" y="830" text-anchor="middle" class="lvl" fill="#4A6580">LEVEL 1 · QUICKEST TO ENTER</text>
  <text x="540" y="864" text-anchor="middle" class="name" fill="#0D1B2A">Entry-level</text>
  <text x="540" y="891" text-anchor="middle" class="paid" fill="#14273A">Paid mainly for time &amp; effort</text>
  <line x1="60" y1="942" x2="1020" y2="942" stroke="#E2DBCE" stroke-width="2"/>
  <circle cx="92" cy="1000" r="30" fill="#F0A500"/><text x="92" y="1011" text-anchor="middle" class="num">5</text>
  <text x="146" y="976" class="rname">EXPERT</text>
  <text x="146" y="1010" class="ex">Consultants · specialist finance, HR or tech pros</text>
  <text x="146" y="1040" class="ex">AI &amp; cybersecurity specialists · specialist trainers</text>
  <text x="146" y="1068" class="get">To get in: years of deep experience in one field</text>
  <line x1="60" y1="1082" x2="1020" y2="1082" stroke="#E2DBCE" stroke-width="2"/>
  <circle cx="92" cy="1140" r="30" fill="#F0A500"/><text x="92" y="1151" text-anchor="middle" class="num">4</text>
  <text x="146" y="1116" class="rname">PROFESSIONAL</text>
  <text x="146" y="1150" class="ex">Software developers · UI/UX designers</text>
  <text x="146" y="1180" class="ex">digital marketers · bookkeeping &amp; GST support</text>
  <text x="146" y="1208" class="get">To get in: relevant qualification or proven skill + samples</text>
  <line x1="60" y1="1222" x2="1020" y2="1222" stroke="#E2DBCE" stroke-width="2"/>
  <circle cx="92" cy="1280" r="30" fill="#F0A500"/><text x="92" y="1291" text-anchor="middle" class="num">3</text>
  <text x="146" y="1256" class="rname">DIGITAL &AMP; LANGUAGE</text>
  <text x="146" y="1290" class="ex">Translators (Tamil, Telugu, Hindi) · data annotators</text>
  <text x="146" y="1320" class="ex">content writers · video editors · online tutors</text>
  <text x="146" y="1348" class="get">To get in: a digital or language skill + work samples</text>
  <line x1="60" y1="1362" x2="1020" y2="1362" stroke="#E2DBCE" stroke-width="2"/>
  <circle cx="92" cy="1420" r="30" fill="#F0A500"/><text x="92" y="1431" text-anchor="middle" class="num">2</text>
  <text x="146" y="1396" class="rname">TRAINED TRADES</text>
  <text x="146" y="1430" class="ex">Electricians · plumbers · AC technicians</text>
  <text x="146" y="1460" class="ex">beauticians · carpenters · home cooks</text>
  <text x="146" y="1488" class="get">To get in: ITI trade, apprenticeship or skilling programme</text>
  <line x1="60" y1="1502" x2="1020" y2="1502" stroke="#E2DBCE" stroke-width="2"/>
  <circle cx="92" cy="1560" r="30" fill="#F0A500"/><text x="92" y="1571" text-anchor="middle" class="num">1</text>
  <text x="146" y="1536" class="rname">ENTRY-LEVEL</text>
  <text x="146" y="1570" class="ex">Delivery partners · bike-taxi &amp; cab drivers</text>
  <text x="146" y="1600" class="ex">warehouse shifts · field survey agents</text>
  <text x="146" y="1628" class="get">To get in: 18+, ID, smartphone (licence &amp; papers to drive)</text>
  <rect x="60" y="1656" width="960" height="196" rx="18" fill="#0D1B2A"/>
  <text x="96" y="1700" class="shiftH">AS YOU MOVE UP</text>
  <text x="96" y="1748" class="shift">Value you offer: time &amp; effort <tspan class="shiftG">→ expertise</tspan></text>
  <text x="96" y="1788" class="shift">What counts more: hours <tspan class="shiftG">→ proven results</tspan></text>
  <text x="96" y="1828" class="shift">Not everyone needs to climb every level.</text>
  <text x="60" y="1896" class="foot">Enaasan framework, not an official classification.</text>
  <text x="1020" y="1896" text-anchor="end" class="footB">enaasan.online</text>
</svg>
